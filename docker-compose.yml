services:
  postgres:
    image: postgres:17-alpine
    container_name: revenue-recovery-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: revenue_recovery
      POSTGRES_USER: revenue_admin
      POSTGRES_PASSWORD: revenue_dev_password
    ports:
      - "5433:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U revenue_admin -d revenue_recovery"]
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  postgres_data: