services:
  postgres:
    image: postgres:17-alpine
    container_name: revenue-recovery-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: revenue_recovery
      POSTGRES_USER: revenue_admin
      POSTGRES_PASSWORD: revenue_dev_password
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U revenue_admin -d revenue_recovery"]
      interval: 5s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    container_name: revenue-recovery-redis
    restart: unless-stopped
    ports:
      - "6380:6379"
    volumes:
      - redis_data:/data
    command: redis-server --appendonly yes
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5

volumes:
  postgres_data:
  redis_data: