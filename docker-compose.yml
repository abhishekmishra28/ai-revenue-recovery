services:
  # ─── Express API Server ─────────────────────────────────────────────────────
  # NOTE: When using Neon DB, the postgres service below is NOT needed.
  # Neon provides a managed cloud PostgreSQL — just set DATABASE_URL
  # to your Neon connection string in the .env file or as an env var.
  server:
    build:
      context: ./server
      dockerfile: Dockerfile
    container_name: revenue-recovery-server
    restart: unless-stopped
    ports:
      - "4000:4000"
    environment:
      NODE_ENV: production
      PORT: 4000
      # ── Set this to your Neon DB connection string ──────────────────────────
      DATABASE_URL: ${DATABASE_URL}
      GEMINI_API_KEY: ${GEMINI_API_KEY}
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:4000/health || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s

  # ─── Next.js Dashboard ─────────────────────────────────────────────────────
  client:
    build:
      context: ./client
      dockerfile: Dockerfile
      args:
        NEXT_PUBLIC_API_URL: ${NEXT_PUBLIC_API_URL:-http://localhost:4000}
    container_name: revenue-recovery-client
    restart: unless-stopped
    ports:
      - "3000:3000"
    environment:
      NODE_ENV: production
    depends_on:
      server:
        condition: service_healthy